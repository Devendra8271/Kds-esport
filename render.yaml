services:
  - type: web
    name: kds-esports
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_EMAIL
        value: its.kds.dev@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: APPS_SCRIPT_URL
        value: https://script.google.com/macros/s/AKfycbxdINJivtOJMpgz95PO4eqWIIifN_-FGec-4pDn9qh23mgdSAasxeWwtctgVkJ1UWhF3g/exec
      - key: PUBLIC_URL
        sync: false
      - key: MIN_WITHDRAWAL
        value: "50"
      - key: ROOM_RELEASE_MINUTES
        value: "15"
