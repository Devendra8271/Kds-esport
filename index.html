<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS E-sport Gaming Hub</title>
    <style>
        :root { --primary: #00ff88; --dark: #0d0f12; --card: #181c24; --gold: #ffd700; }
        body { margin: 0; font-family: sans-serif; background: var(--dark); color: #fff; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--card); border-bottom: 2px solid var(--primary); }
        .logo { font-size: 18px; font-weight: bold; color: var(--primary); }
        /* Wallet hidden until login */
        .wallet { background: #222a36; padding: 6px 12px; border-radius: 20px; font-weight: bold; color: var(--gold); display: none; }
        .container { padding: 15px; max-width: 500px; margin: auto; }
        .card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 15px; border: 1px solid #28303d; }
        .btn { background: var(--primary); color: #000; border: none; padding: 10px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; }
        .input { width: 93%; padding: 10px; margin: 8px 0; background: #0d0f12; border: 1px solid #28303d; color: #fff; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">⚡ KDS E-sport</div>
        <div class="wallet" id="walletDisplay">Balance: ₹0</div>
    </div>

    <div class="container">
        <!-- AUTH CARD -->
        <div id="authCard" class="card">
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button class="btn" id="loginTab" onclick="switchTab('login')">Login</button>
                <button class="btn" id="regTab" style="background:#333; color:#fff;" onclick="switchTab('register')">Register</button>
            </div>

            <!-- LOGIN FORM -->
            <div id="loginForm">
                <h3>🔐 Player Login</h3>
                <input type="text" id="loginId" class="input" placeholder="Mobile Number or Email">
                <input type="password" id="loginPass" class="input" placeholder="Password">
                <button class="btn" onclick="handleLogin()">Login</button>
                <p style="text-align:center;"><a href="#" onclick="forgotPassword()" style="color:var(--primary);">Forgot Password?</a></p>
            </div>

            <!-- REGISTER FORM -->
            <div id="registerForm" style="display: none;">
                <h3>📝 New Registration</h3>
                <input type="text" id="regName" class="input" placeholder="Full Name">
                <input type="email" id="regEmail" class="input" placeholder="Email Address">
                <input type="text" id="regMobile" class="input" placeholder="Mobile Number">
                
                <!-- Native Browser Date Picker Popup -->
                <input type="date" id="regDob" class="input" title="Select Date of Birth">
                
                <select id="regGender" class="input">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
                
                <!-- Referral Option -->
                <input type="text" id="regReferral" class="input" placeholder="Referral Code (Optional)">
                
                <input type="password" id="regPass" class="input" placeholder="Create Password">
                <button class="btn" onclick="handleRegister()">Register Now</button>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard" style="display: none;">
            <h3>🎮 Available Matches</h3>
            <div id="matchesList"></div>
        </div>
    </div>

    <script>
        const API = "/api";
        let currentUser = null;

        function switchTab(tab) {
            if (tab === 'login') {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('loginTab').style.background = '#00ff88'; document.getElementById('loginTab').style.color = '#000';
                document.getElementById('regTab').style.background = '#333'; document.getElementById('regTab').style.color = '#fff';
            } else {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('regTab').style.background = '#00ff88'; document.getElementById('regTab').style.color = '#000';
                document.getElementById('loginTab').style.background = '#333'; document.getElementById('loginTab').style.color = '#fff';
            }
        }

        async function handleLogin() {
            const identifier = document.getElementById('loginId').value;
            const password = document.getElementById('loginPass').value;

            const res = await fetch(`${API}/player/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier, password })
            });
            const data = await res.json();
            
            if (data.success) {
                alert('Login Successful!');
                currentUser = data.user;
                
                // Show Wallet only after Successful Login
                const wallet = document.getElementById('walletDisplay');
                wallet.innerText = `Balance: ₹${currentUser.walletBalance || 0}`;
                wallet.style.display = 'block';

                document.getElementById('authCard').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadMatches();
            } else {
                alert(data.message);
            }
        }

        async function handleRegister() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const mobile = document.getElementById('regMobile').value;
            const dob = document.getElementById('regDob').value;
            const gender = document.getElementById('regGender').value;
            const referralCode = document.getElementById('regReferral').value;
            const password = document.getElementById('regPass').value;

            const res = await fetch(`${API}/player/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, mobile, dob, gender, referralCode, password })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) switchTab('login');
        }

        async function forgotPassword() {
            const identifier = prompt('Enter registered Email or Mobile Number:');
            if (identifier) {
                const res = await fetch(`${API}/player/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier })
                });
                const data = await res.json();
                alert(data.message);
            }
        }

        async function loadMatches() {
            const res = await fetch(`${API}/tournaments`);
            const data = await res.json();
            const container = document.getElementById('matchesList');
            container.innerHTML = "";
            (data.tournaments || []).forEach(m => {
                container.innerHTML += `
                    <div class="card">
                        <h4>${m.gameName} (${m.matchMode})</h4>
                        <p>Date: ${m.matchDate} | Fee: ₹${m.entryFee}</p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
