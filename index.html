<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS E-sport Gaming Hub</title>
    <style>
        :root { --primary: #00ff88; --dark: #0d0f12; --card: #181c24; --text: #ffffff; --gold: #ffd700; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--dark); color: var(--text); }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--card); border-bottom: 2px solid var(--primary); }
        .logo-container { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, #00ff88, #00b3ff); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #000; }
        .logo-text { font-size: 18px; font-weight: bold; color: var(--primary); }
        
        /* Wallet initially hidden */
        .wallet { display: none; background: #222a36; padding: 6px 12px; border-radius: 20px; font-weight: bold; color: var(--gold); border: 1px solid #333; }
        
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 15px; border: 1px solid #28303d; }
        .btn { background: var(--primary); color: #000; border: none; padding: 10px 15px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; }
        .input { width: 95%; padding: 10px; margin: 8px 0; background: #0d0f12; border: 1px solid #28303d; color: #fff; border-radius: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-container">
            <div class="logo-icon">⚡</div>
            <div class="logo-text">KDS E-sport</div>
        </div>
        <!-- Wallet is shown only after login -->
        <div class="wallet" id="walletDisplay">Balance: ₹0</div>
    </div>

    <div class="container">
        <!-- AUTH CARD -->
        <div id="authCard" class="card">
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button class="btn" id="loginTabBtn" onclick="switchTab('login')">Login</button>
                <button class="btn" id="regTabBtn" onclick="switchTab('register')" style="background: #333; color: #fff;">Register</button>
            </div>

            <!-- Login Form -->
            <div id="loginForm">
                <h3 style="margin-top: 0; color: var(--primary);">🔐 Player Login</h3>
                <input type="text" id="loginIdentifier" class="input" placeholder="Mobile Number or Email">
                <input type="password" id="loginPassword" class="input" placeholder="Password">
                <button class="btn" onclick="handleLogin()">Login</button>
                <p style="margin-top: 10px; text-align: center;"><a href="#" onclick="forgotPassword()" style="color: #00ff88; text-decoration: none;">Forgot Password?</a></p>
            </div>

            <!-- Register Form -->
            <div id="registerForm" style="display: none;">
                <h3 style="margin-top: 0; color: var(--primary);">📝 New Registration</h3>
                <input type="text" id="regName" class="input" placeholder="Full Name">
                <input type="email" id="regEmail" class="input" placeholder="Email Address">
                <input type="text" id="regMobile" class="input" placeholder="Mobile Number">
                
                <label style="font-size:12px; color:#aaa; display:block; margin-top:5px;">Date of Birth:</label>
                <input type="date" id="regDob" class="input">
                
                <select id="regGender" class="input">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
                <input type="password" id="regPassword" class="input" placeholder="Create Password">
                <input type="password" id="regConfirmPassword" class="input" placeholder="Confirm Password">
                <button class="btn" onclick="handleRegister()">Register Now</button>
            </div>
        </div>

        <!-- MAIN DASHBOARD -->
        <div id="mainDashboard" class="hidden">
            <h2>🎮 Dashboard</h2>
            <div id="matchesContainer"></div>
        </div>
    </div>

    <script>
        let currentUser = null;

        function switchTab(tab) {
            if (tab === 'login') {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
            } else {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
            }
        }

        function calculateAge(dobString) {
            const today = new Date();
            const birthDate = new Date(dobString);
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
            return age;
        }

        async function handleLogin() {
            const identifier = document.getElementById('loginIdentifier').value;
            const password = document.getElementById('loginPassword').value;

            if (!identifier || !password) return alert('Please enter all login details!');

            const res = await fetch('/api/player/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier, password })
            });
            const result = await res.json();
            
            if (result.success) {
                alert('Login Successful!');
                currentUser = result.user;
                
                // Show Wallet only on Login
                const walletElem = document.getElementById('walletDisplay');
                walletElem.innerText = `Balance: ₹${currentUser.walletBalance}`;
                walletElem.style.display = 'block';

                document.getElementById('authCard').style.display = 'none';
                document.getElementById('mainDashboard').style.display = 'block';
            } else {
                alert(result.message);
            }
        }

        async function handleRegister() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const mobile = document.getElementById('regMobile').value;
            const dob = document.getElementById('regDob').value;
            const gender = document.getElementById('regGender').value;
            const password = document.getElementById('regPassword').value;

            if (calculateAge(dob) < 10) return alert('Player must be at least 10 years old!');

            const res = await fetch('/api/player/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, mobile, dob, gender, password })
            });
            const result = await res.json();
            alert(result.message);
            if (result.success) switchTab('login');
        }

        async function forgotPassword() {
            const info = prompt('Enter your registered Mobile Number or Email:');
            if (info) {
                const res = await fetch('/api/player/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier: info })
                });
                const result = await res.json();
                alert(result.message);
            }
        }
    </script>
</body>
</html>
