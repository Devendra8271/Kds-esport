<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KDS Esports - Player Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #fff; display: flex; flex-direction: column; min-height: 100vh; }
    header { background: #1e293b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #38bdf8; }
    header h1 { font-size: 20px; color: #38bdf8; }
    #walletDisplay { background: #10b981; color: #fff; padding: 6px 14px; border-radius: 20px; font-weight: bold; display: none; }
    .container { max-width: 450px; margin: 40px auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #334155; }
    .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: #94a3b8; font-size: 16px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }
    .form-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
    .btn { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; }
    .btn:hover { background: #0284c7; color: #fff; }
    .link-btn { background: none; border: none; color: #38bdf8; cursor: pointer; margin-top: 10px; font-size: 13px; text-decoration: underline; }
    #dashboard { display: none; text-align: center; }
    .msg-box { margin-top: 10px; padding: 10px; border-radius: 6px; display: none; font-size: 14px; }
    .msg-success { background: #065f46; color: #34d399; }
    .msg-error { background: #881337; color: #fda4af; }
  </style>
</head>
<body>

  <header>
    <h1>KDS ESPORTS</h1>
    <div id="walletDisplay">Balance: ₹<span id="balanceVal">0</span></div>
  </header>

  <div class="container">
    <!-- Auth Section -->
    <div id="authSection">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email or Mobile Number</label>
          <input type="text" id="loginIdentifier" placeholder="Enter Email or Mobile" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter Password" required>
        </div>
        <button type="submit" class="btn">Login</button>
        <button type="button" class="link-btn" onclick="handleForgotPassword()">Forgot Password?</button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="regUsername" placeholder="Enter Username" required>
        </div>
        <div class="form-group">
          <label>Email ID</label>
          <input type="email" id="regEmail" placeholder="Enter Email" required>
        </div>
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" id="regMobile" placeholder="Enter Mobile Number" required>
        </div>
        <div class="form-group">
          <label>Date of Birth (Calendar)</label>
          <input type="date" id="regDob" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="Create Password" required>
        </div>
        <div class="form-group">
          <label>Referral Code (Optional)</label>
          <input type="text" id="regReferral" placeholder="Enter Referral Code">
        </div>
        <button type="submit" class="btn">Register Now</button>
      </form>

      <div id="msgBox" class="msg-box"></div>
    </div>

    <!-- Logged-in Dashboard -->
    <div id="dashboard">
      <h2>Welcome, <span id="userWelcome"></span>!</h2>
      <p style="margin: 15px 0; color: #cbd5e1;">You are logged in successfully.</p>
      <button class="btn" onclick="handleLogout()" style="background: #ef4444; color: #fff;">Logout</button>
    </div>
  </div>

  <script>
    function showMsg(text, isSuccess) {
      const msgBox = document.getElementById('msgBox');
      msgBox.innerText = text;
      msgBox.className = 'msg-box ' + (isSuccess ? 'msg-success' : 'msg-error');
      msgBox.style.display = 'block';
    }

    function switchTab(tab) {
      document.getElementById('msgBox').style.display = 'none';
      const buttons = document.querySelectorAll('.tab-btn');
      if (tab === 'login') {
        buttons[0].classList.add('active');
        buttons[1].classList.remove('active');
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
      } else {
        buttons[1].classList.add('active');
        buttons[0].classList.remove('active');
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
      }
    }

    // Frontend Age Calculation (10 Years restriction)
    function validateAge(dobValue) {
      const birthDate = new Date(dobValue);
      const today = new Date();
      let age = today.getFullYear() - birthDate.getFullYear();
      const m = today.getMonth() - birthDate.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
        age--;
      }
      return age >= 10;
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('regUsername').value;
      const email = document.getElementById('regEmail').value;
      const mobile = document.getElementById('regMobile').value;
      const dob = document.getElementById('regDob').value;
      const password = document.getElementById('regPassword').value;
      const referralCode = document.getElementById('regReferral').value;

      if (!validateAge(dob)) {
        showMsg("Registration failed: Player must be at least 10 years old.", false);
        return;
      }

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, mobile, dob, password, referralCode })
      });

      const data = await res.json();
      showMsg(data.message, data.success);
      if (data.success) {
        document.getElementById('registerForm').reset();
        setTimeout(() => switchTab('login'), 2000);
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const identifier = document.getElementById('loginIdentifier').value;
      const password = document.getElementById('loginPassword').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier, password })
      });

      const data = await res.json();
      if (data.success) {
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('walletDisplay').style.display = 'block';
        document.getElementById('balanceVal').innerText = data.user.walletBalance;
        document.getElementById('userWelcome').innerText = data.user.username;
      } else {
        showMsg(data.message, false);
      }
    }

    async function handleForgotPassword() {
      const email = prompt("Enter your registered Email ID to receive your password:");
      if (!email) return;

      showMsg("Sending email... Please wait.", true);
      const res = await fetch('/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });

      const data = await res.json();
      showMsg(data.message, data.success);
    }

    function handleLogout() {
      document.getElementById('authSection').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('walletDisplay').style.display = 'none';
      document.getElementById('loginForm').reset();
    }
  </script>
</body>
</html>
