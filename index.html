<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS Esports - Player Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f0f12; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1a1a24; border-radius: 10px; padding: 20px; width: 100%; max-width: 400px; border: 1px solid #333; margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #444; background: #252533; color: white; box-sizing: border-box; }
        button { background: #ff4757; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #ff6b81; }
        .link { color: #70a1ff; cursor: pointer; text-align: center; font-size: 0.9em; display: block; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="authContainer">
    <!-- LOGIN FORM -->
    <div id="loginCard" class="card">
        <h2>Player Login</h2>
        <input type="text" id="loginIdentifier" placeholder="Email or Mobile Number">
        <input type="password" id="loginPassword" placeholder="Password">
        <button onclick="handleLogin()">LOGIN</button>
        <span class="link" onclick="toggleView('forgot')">Forgot Password?</span>
        <span class="link" onclick="toggleView('register')">Don't have an account? Register</span>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerCard" class="card hidden">
        <h2>Player Registration</h2>
        <input type="text" id="regName" placeholder="Full Name">
        <input type="email" id="regEmail" placeholder="Email Address">
        <input type="text" id="regMobile" placeholder="Mobile Number">
        <input type="date" id="regDob">
        <select id="regGender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
        <input type="password" id="regPassword" placeholder="Password">
        <input type="text" id="regReferral" placeholder="Referral Code (Optional)">
        <button onclick="handleRegister()">REGISTER</button>
        <span class="link" onclick="toggleView('login')">Already have an account? Login</span>
    </div>

    <!-- FORGOT PASSWORD FORM -->
    <div id="forgotCard" class="card hidden">
        <h2>Forgot Password</h2>
        <p style="font-size: 0.85em; color: #ccc;">Enter Registered Email or Mobile to receive reset link.</p>
        <input type="text" id="forgotIdentifier" placeholder="Email or Mobile">
        <button onclick="handleForgot()">SEND RESET LINK</button>
        <span class="link" onclick="toggleView('login')">Back to Login</span>
    </div>
</div>

<!-- PLAYER DASHBOARD -->
<div id="dashboardCard" class="card hidden">
    <h2>Welcome, <span id="playerName"></span>!</h2>
    <p><b>Wallet Balance:</b> ₹<span id="playerWallet">0</span></p>
    <p><b>Referral Code:</b> <span id="playerReferCode"></span></p>
    <button onclick="logout()">LOGOUT</button>
</div>

<script>
    function toggleView(view) {
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('registerCard').classList.add('hidden');
        document.getElementById('forgotCard').classList.add('hidden');
        if (view === 'login') document.getElementById('loginCard').classList.remove('hidden');
        if (view === 'register') document.getElementById('registerCard').classList.remove('hidden');
        if (view === 'forgot') document.getElementById('forgotCard').classList.remove('hidden');
    }

    async function handleLogin() {
        const identifier = document.getElementById('loginIdentifier').value;
        const password = document.getElementById('loginPassword').value;
        
        const res = await fetch('/api/player/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ identifier, password })
        });
        const data = await res.json();
        if(data.success) {
            showDashboard(data.user);
        } else {
            alert(data.message);
        }
    }

    async function handleRegister() {
        const payload = {
            name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            mobile: document.getElementById('regMobile').value,
            dob: document.getElementById('regDob').value,
            gender: document.getElementById('regGender').value,
            password: document.getElementById('regPassword').value,
            referredBy: document.getElementById('regReferral').value
        };

        const res = await fetch('/api/player/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        alert(data.message);
        if(data.success) toggleView('login');
    }

    async function handleForgot() {
        const identifier = document.getElementById('forgotIdentifier').value;
        const res = await fetch('/api/player/forgot-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ identifier })
        });
        const data = await res.json();
        alert(data.message);
    }

    function showDashboard(user) {
        document.getElementById('authContainer').classList.add('hidden');
        document.getElementById('dashboardCard').classList.remove('hidden');
        document.getElementById('playerName').innerText = user.name;
        document.getElementById('playerWallet').innerText = user.walletBalance;
        document.getElementById('playerReferCode').innerText = user.referralCode;
    }

    function logout() {
        location.reload();
    }
</script>
</body>
</html>
