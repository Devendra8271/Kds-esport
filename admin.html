

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS E-sport - Master Admin Panel</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 700px; margin: auto; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .input { width: 95%; padding: 10px; margin: 8px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px; }
        .btn { background: #00ff88; color: #000; font-weight: bold; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <h1 style="color: #00ff88; text-align: center;">⚡ KDS E-sport Admin Panel</h1>

   <div class="card" id="loginCard">
    <h3>🔒 Admin Authentication</h3>
    <input type="password" id="adminSecret" class="input" placeholder="Enter Admin Secret Key">
    <button class="btn" onclick="loginAdmin()" style="margin-top: 10px;">Login Panel</button>
</div>

<div id="adminContent" style="display: none;">

    <div class="card">
        <h3>📲 APK Download Link Update</h3>
        <input type="text" id="apkLink" class="input" placeholder="Direct APK URL">
        <button class="btn" onclick="updateApkLink()">Update App Link</button>
    </div>

    <div class="card">
        <h3>🏆 Add New Tournament</h3>
        <input type="text" id="gameName" class="input" placeholder="Game Name (e.g., BGMI / FreeFire)">
        <select id="matchMode" class="input">
            <option value="SOLO">SOLO</option>
            <option value="DUO">DUO</option>
            <option value="SQUAD">SQUAD</option>
        </select>
        <input type="text" id="matchDate" class="input" placeholder="Date (e.g., 2026-08-30)">
        <input type="text" id="matchTime" class="input" placeholder="Time (e.g., 08:00 PM)">
        <input type="text" id="bannerUrl" class="input" placeholder="Banner Image URL">
        <input type="number" id="entryFee" class="input" placeholder="Entry Fee (₹)">
        <input type="text" id="upiId" class="input" placeholder="UPI ID for Payments">
        <input type="number" id="perKill" class="input" placeholder="Per Kill Reward (₹)">
        <input type="number" id="rank1" class="input" placeholder="Rank #1 Reward (₹)">
        <button class="btn" onclick="addTournament()">Publish Match</button>
    </div>

    <div class="card">
        <h3>🎮 Broadcast Room Credentials</h3>
        <input type="text" id="roomTId" class="input" placeholder="Tournament ID (e.g. T101)">
        <input type="text" id="roomId" class="input" placeholder="Room ID">
        <input type="text" id="roomPass" class="input" placeholder="Room Password">
        <button class="btn" onclick="updateRoom()">Push to Players</button>
    </div>

    <div class="card">
        <h3>🤖 Automated Result Settlement</h3>
        <input type="text" id="settleTId" class="input" placeholder="Tournament ID (e.g. T101)">
        <textarea id="settleResults" class="input" placeholder='JSON Array: [{"identifier":"user@mail.com","kills":4,"rank":1}]' style="height: 60px;"></textarea>
        <button class="btn" onclick="settleMatch()">Settle & Distribute Funds</button>
    </div>

    <div class="card">
        <h3>📢 Push Broadcast Notification</h3>
        <input type="text" id="broadcastTitle" class="input" placeholder="Notification Title">
        <input type="text" id="broadcastMessage" class="input" placeholder="Notification Message">
        <button class="btn" onclick="sendBroadcast()">Send Push Alert</button>
    </div>

    <div class="card">
        <h3>📊 Data Export Options</h3>
        <button class="btn" onclick="exportData('EXPORT_USERS_DATA')">Export Registered Users</button>
        <button class="btn" style="background:#ffd700;" onclick="exportData('EXPORT_BOOKINGS_DATA')">Export Match Bookings</button>
    </div>

    <script>
        const API_URL = "https://kds-esport.onrender.com/api/admin/system-control";

        async function postAdmin(action, data) {
            const adminSecret = document.getElementById('adminSecret').value;
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminSecret, action, data })
            });
            const result = await res.json();
            alert(result.message || "Action Executed");
            return result;
        }

        function updateApkLink() {
            postAdmin("UPDATE_APP_LINK", { appDownloadUrl: document.getElementById('apkLink').value });
        }

        function addTournament() {
            postAdmin("ADD_TOURNAMENT", {
                gameName: document.getElementById('gameName').value,
                matchMode: document.getElementById('matchMode').value,
                matchDate: document.getElementById('matchDate').value,
                matchTime: document.getElementById('matchTime').value,
                bannerUrl: document.getElementById('bannerUrl').value,
                entryFee: document.getElementById('entryFee').value,
                upiId: document.getElementById('upiId').value,
                perKillPrize: document.getElementById('perKill').value,
                rank1Prize: document.getElementById('rank1').value
            });
        }

        function updateRoom() {
            postAdmin("UPDATE_ROOM", {
                tournamentId: document.getElementById('roomTId').value,
                roomId: document.getElementById('roomId').value,
                roomPass: document.getElementById('roomPass').value
            });
        }

        function settleMatch() {
            postAdmin("AUTO_SETTLE_MATCH", {
                tournamentId: document.getElementById('settleTId').value,
                results: JSON.parse(document.getElementById('settleResults').value)
            });
        }

        function sendBroadcast() {
            postAdmin("PUSH_GLOBAL_NOTIFICATION", {
                title: document.getElementById('broadcastTitle').value,
                message: document.getElementById('broadcastMessage').value
            });
        }

        async function exportData(action) {
            const result = await postAdmin(action, {});
            if (result.success) {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(result));
                const dlAnchorElem = document.createElement('a');
                dlAnchorElem.setAttribute("href", dataStr);
                dlAnchorElem.setAttribute("download", `${action}.json`);
                dlAnchorElem.click();
            }
        }
                </div>
        function loginAdmin() {
    const key = document.getElementById('adminSecret').value;
    if (key === 'dev8271@') {
        document.getElementById('adminContent').style.display = 'block';
        document.getElementById('loginCard').style.display = 'none';
        alert('Access Granted!');
    } else {
        alert('Wrong Secret Key!');
    }
}
    </script>
</body>
</html>
