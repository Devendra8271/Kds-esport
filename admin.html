<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS Esports - Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; border: 1px solid #333; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; box-sizing: border-box; }
        input { background: #2a2a2a; color: #fff; border: 1px solid #444; }
        button { background: #2ed573; color: #000; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <h2>Admin Access Panel</h2>
    <input type="password" id="adminSecret" placeholder="Enter Admin Secret Passcode">
    <hr>
    <h3>Ban / Unban Player</h3>
    <input type="text" id="banUserIdentifier" placeholder="Player Email or Mobile">
    <button onclick="toggleBan(true)">BAN PLAYER</button>
    <button onclick="toggleBan(false)" style="background:#ffa502;">UNBAN PLAYER</button>
</div>

<script>
    async function toggleBan(banStatus) {
        const secret = document.getElementById('adminSecret').value;
        const identifier = document.getElementById('banUserIdentifier').value;

        if(!secret) return alert("Enter Secret Passcode!");

        const res = await fetch('/api/admin/system-control', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                adminSecret: secret,
                action: "TOGGLE_USER_BAN",
                data: { playerIdentifier: identifier, banStatus: banStatus }
            })
        });
        const data = await res.json();
        alert(data.message);
    }
</script>
</body>
</html>
