<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS E-sport Master Admin Panel</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 700px; margin: auto; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        .input { width: 95%; padding: 10px; margin: 8px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px; }
        .btn { background: #00ff88; color: #000; font-weight: bold; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        .btn-danger { background: #ff4757; color: #fff; }
    </style>
</head>
<body>
    <h1 style="color: #00ff88; text-align: center;">⚡ KDS E-sport Admin Panel</h1>

   <div class="card" id="loginCard">
        <h3>🔒 Admin Authentication</h3>
        <input type="password" id="adminSecret" class="input" placeholder="Enter Admin Secret Key">
        <button class="btn" onclick="loginAdmin()" style="margin-top: 10px;">Login Panel</button>
   </div>

   <div id="adminContent" style="display: none;">
        <div class="card" style="border-color: #ff4757;">
            <h3 style="color: #ff4757;">🚫 Player Management (Ban / Kick)</h3>
            <input type="text" id="manageUserIdentifier" class="input" placeholder="Player Email or Mobile">
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <button class="btn btn-danger" onclick="toggleUserBan(true)">Ban Player</button>
                <button class="btn" onclick="toggleUserBan(false)" style="background: #2ed573; color: #fff;">Unban Player</button>
            </div>
            <hr style="border-color: #333; margin: 15px 0;">
            <input type="text" id="kickTId" class="input" placeholder="Tournament ID (e.g. T101)">
            <input type="text" id="kickUserEmail" class="input" placeholder="Player Email">
            <button class="btn btn-danger" onclick="kickPlayer()">Remove Player From Match</button>
        </div>

        <div class="card">
            <h3>🏆 Add New Tournament</h3>
            <input type="text" id="gameName" class="input" placeholder="Game Name (e.g., BGMI)">
            <select id="matchMode" class="input"><option value="SOLO">SOLO</option><option value="DUO">DUO</option><option value="SQUAD">SQUAD</option></select>
            <input type="text" id="matchDate" class="input" placeholder="Date (2026-09-30)">
            <input type="text" id="matchTime" class="input" placeholder="Time (08:00 PM)">
            <input type="text" id="bannerUrl" class="input" placeholder="Banner Image URL">
            <input type="number" id="entryFee" class="input" placeholder="Entry Fee (₹)">
            <input type="text" id="upiId" class="input" placeholder="UPI ID">
            <input type="number" id="perKill" class="input" placeholder="Per Kill Reward">
            <input type="number" id="rank1" class="input" placeholder="Rank #1 Reward">
            <button class="btn" onclick="addTournament()">Publish Match</button>
        </div>

        <div class="card">
            <h3>🎮 Broadcast Room Credentials</h3>
            <input type="text" id="roomTId" class="input" placeholder="Tournament ID (e.g. T101)">
            <input type="text" id="roomId" class="input" placeholder="Room ID">
            <input type="text" id="roomPass" class="input" placeholder="Room Password">
            <button class="btn" onclick="updateRoom()">Push to Players</button>
        </div>
   </div>

    <script>
        const API_URL = "https://kds-esport.onrender.com/api/admin/system-control";

        async function postAdmin(action, data) {
            const adminSecret = document.getElementById('adminSecret').value;
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminSecret, action, data })
            });
            const result = await res.json();
            alert(result.message);
        }

        function addTournament() {
            postAdmin("ADD_TOURNAMENT", {
                gameName: document.getElementById('gameName').value, matchMode: document.getElementById('matchMode').value,
                matchDate: document.getElementById('matchDate').value, matchTime: document.getElementById('matchTime').value,
                bannerUrl: document.getElementById('bannerUrl').value, entryFee: document.getElementById('entryFee').value,
                upiId: document.getElementById('upiId').value, perKillPrize: document.getElementById('perKill').value, rank1Prize: document.getElementById('rank1').value
            });
        }

        function updateRoom() {
            postAdmin("UPDATE_ROOM", { tournamentId: document.getElementById('roomTId').value, roomId: document.getElementById('roomId').value, roomPass: document.getElementById('roomPass').value });
        }

        function toggleUserBan(banStatus) {
            postAdmin("TOGGLE_USER_BAN", { playerIdentifier: document.getElementById('manageUserIdentifier').value, banStatus });
        }

        function kickPlayer() {
            postAdmin("KICK_PLAYER", { tournamentId: document.getElementById('kickTId').value, playerIdentifier: document.getElementById('kickUserEmail').value });
        }

        function loginAdmin() {
            if (document.getElementById('adminSecret').value === 'dev8271@') {
                document.getElementById('adminContent').style.display = 'block';
                document.getElementById('loginCard').style.display = 'none';
                alert('Access Granted!');
            } else { alert('Wrong Key!'); }
        }
    </script>
</body>
</html>
