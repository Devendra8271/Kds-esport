<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KDS Esports - Admin Panel</title>
  <style>
    body { background: #090d16; color: #fff; font-family: sans-serif; padding: 20px; }
    .card { background: #151c2c; padding: 20px; border-radius: 8px; max-width: 500px; margin: 20px auto; border: 1px solid #1e293b; }
    h2 { color: #38bdf8; margin-bottom: 15px; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 5px; border: none; }
    input { background: #0f172a; color: #fff; border: 1px solid #334155; }
    button { background: #38bdf8; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Admin Authentication</h2>
    <input type="password" id="adminSecret" placeholder="Enter Secret Key (dev8271@)">
    <button onclick="loginAdmin()">Access Admin Panel</button>
  </div>

  <script>
    function loginAdmin() {
      const key = document.getElementById('adminSecret').value;
      if (key === 'dev8271@') {
        alert("Admin Access Granted!");
      } else {
        alert("Invalid Admin Key!");
      }
    }
  </script>
</body>
</html>
