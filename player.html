<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KDS E-sports — Player</title>
<style>
:root{--bg:#070b11;--card:#111925;--line:#263447;--green:#00e887;--muted:#91a0b4;--red:#ff5d6c}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at top,#101c2b,#070b11 45%);color:#fff}.wrap{max-width:1180px;margin:auto;padding:20px}
nav,.card{background:rgba(17,25,37,.96);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 8px 28px #0004}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:10px;z-index:5}.logo{width:145px;height:52px;object-fit:contain}
h1,h2,h3{margin-top:0}input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:11px;border:1px solid #344054;background:#0c141f;color:#fff}button{background:var(--green);color:#06130d;font-weight:900;cursor:pointer;border:0}.danger{background:var(--red);color:#fff}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.hidden{display:none}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#1b2b3d;margin:3px}.match{border:1px solid #263447;border-radius:14px;padding:14px;margin:10px 0}.match img{width:100%;height:150px;object-fit:cover;border-radius:12px}.avatar{width:125px;height:125px;border-radius:50%;object-fit:cover;border:3px solid var(--green);box-shadow:0 0 25px #00e88733}.topbar{display:flex;align-items:center;gap:12px}.stat{font-size:20px;font-weight:900;color:var(--green)}a{color:#70ffbc}
</style></head>
<body><div class="wrap">
<nav><div class="topbar"><img class="logo" src="/kds-logo.svg" alt="KDS E-sports"><strong>KDS E-sports</strong></div><span id="status" class="muted">Guest</span><button id="logoutBtn" style="width:auto;padding:9px 16px" onclick="logout()">Logout</button></nav>

<div id="auth" class="grid">
<section class="card"><h2>Player Registration</h2>
<input id="rname" placeholder="Full name"><input id="remail" type="email" placeholder="Email"><input id="rmobile" placeholder="Mobile"><input id="rdob" type="date"><input id="rgender" placeholder="Gender">
<input id="rpass" type="password" placeholder="Password (8+ characters)"><input id="rref" placeholder="Referral code (optional)"><button onclick="register()">Create Account</button></section>
<section class="card"><h2>Login</h2><input id="lid" placeholder="Email or Mobile"><input id="lpass" type="password" placeholder="Password"><button onclick="login()">Login</button><hr>
<h3>Forgot Password</h3><input id="fid" placeholder="Registered Email or Mobile"><button onclick="forgot()">Send 15-minute Reset Link</button></section></div>

<div id="app" class="hidden">
<section class="card"><div class="topbar"><img id="avatar" class="avatar" src="/default-avatar.svg" alt="Player photo"><div><h2 id="pnameTitle">Player Profile</h2><div id="profile"></div></div></div>
<h3>Edit Profile</h3><input id="pname" placeholder="Name"><input id="pgender" placeholder="Gender"><label class="muted">Upload Photo</label><input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewPhoto(event)"><input id="pavatar" placeholder="Or paste avatar image URL">
<div class="grid"><button onclick="saveProfile()">Save Profile</button><button onclick="useDefaultAvatar()">Use Default Avatar</button></div></section>

<section class="card"><h2>Matches</h2><div class="grid"><select id="cat" onchange="loadMatches()"><option value="">All games</option><option>Free Fire</option><option>BDG</option></select><select id="mode" onchange="loadMatches()"><option value="">All modes</option><option>BR Solo</option><option>BR Duo</option><option>BR Squad</option><option>CS 1v1</option><option>CS 2v2</option><option>CS 4v4</option><option>Lone Wolf</option><option>Craftland</option><option>Wingo 1-Min</option><option>Aviator</option></select></div><div id="matches"></div></section>

<section class="grid"><div class="card"><h2>Deposit</h2><div id="payment"></div><input id="damt" type="number" min="1" placeholder="Amount"><input id="dutr" inputmode="numeric" placeholder="12-digit UTR"><button onclick="deposit()">Submit Deposit</button></div>
<div class="card"><h2>Withdrawal</h2><input id="wamt" type="number" min="1" placeholder="Amount"><input id="wupi" placeholder="UPI ID"><button onclick="withdraw()">Request Withdrawal</button></div></section>

<section class="grid"><div class="card"><h2>Weekly Loyalty</h2><div id="loyalty"></div><button onclick="evaluateLoyalty()">Evaluate VIP Pass</button></div><div class="card"><h2>Notifications</h2><div id="notifications"></div><button onclick="readNotifications()">Mark all read</button></div></section>
<section class="card"><h2>Match Proof / Dispute</h2><select id="proofTournament"></select><input id="proofUrl" placeholder="Screenshot URL"><input id="proofKills" type="number" min="0" placeholder="Kills claimed"><button onclick="submitProof()">Submit Result Proof</button></section>
</div></div>
<script>
let token=localStorage.getItem("kdsPlayerToken"), player=JSON.parse(localStorage.getItem("kdsPlayer")||"null"), selectedPhotoData="";
const $=id=>document.getElementById(id);
function msg(x){alert(x)}
async function req(url,opt={}){const r=await fetch("/api"+url,{...opt,headers:{"Content-Type":"application/json","x-player-token":token,...(opt.headers||{})}});const j=await r.json();if(!j.success)throw Error(j.error||"Request failed");return j}
function updateProfileUI(){if(!player)return;$("profile").innerHTML=`<b>${player.name}</b><br>${player.email}<br>${player.mobile||""}<br><span class="stat">Wallet ₹${player.wallet||0}</span> · VIP ${player.vipPasses||0}`;$("pname").value=player.name||"";$("pgender").value=player.gender||"";$("pavatar").value=player.avatarUrl||"";$("avatar").src=player.avatarUrl||"/default-avatar.svg";$("pnameTitle").textContent=player.name+" — Profile"}
function previewPhoto(e){const f=e.target.files?.[0];if(!f)return;if(f.size>5*1024*1024)return msg("Photo 5 MB se chhoti honi chahiye.");if(!/^image\\/(jpeg|png|webp)$/.test(f.type))return msg("JPG, PNG ya WEBP allowed hai.");const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=512,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext("2d").drawImage(img,0,0,c.width,c.height);selectedPhotoData=c.toDataURL("image/jpeg",.82);$("avatar").src=selectedPhotoData;$("pavatar").value=""};img.src=r.result};r.readAsDataURL(f)}
async function saveProfile(){try{const j=await req("/profile",{method:"PUT",body:JSON.stringify({name:$("pname").value,gender:$("pgender").value,avatarUrl:selectedPhotoData||$("pavatar").value})});player=j.player;selectedPhotoData="";$("photoFile").value="";localStorage.setItem("kdsPlayer",JSON.stringify(player));updateProfileUI();msg("Profile updated.")}catch(e){msg(e.message)}}
function useDefaultAvatar(){$("pavatar").value="/default-avatar.svg";$("photoFile").value="";selectedPhotoData="";$("avatar").src="/default-avatar.svg"}
async function register(){try{const j=await req("/register",{method:"POST",headers:{"x-player-token":""},body:JSON.stringify({name:$("rname").value,email:$("remail").value,mobile:$("rmobile").value,dob:$("rdob").value,gender:$("rgender").value,password:$("rpass").value,referredBy:$("rref").value})});msg(j.message);await loginWith($("remail").value,$("rpass").value)}catch(e){msg(e.message)}}
async function loginWith(identifier,password){const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({identifier,password})});const j=await r.json();if(!j.success)throw Error(j.error);token=j.token;player=j.player;localStorage.setItem("kdsPlayerToken",token);localStorage.setItem("kdsPlayer",JSON.stringify(player));show()}
async function login(){try{await loginWith($("lid").value,$("lpass").value)}catch(e){msg(e.message)}}
async function forgot(){try{const j=await req("/forgot-password",{method:"POST",headers:{"x-player-token":""},body:JSON.stringify({identifier:$("fid").value})});msg(j.message)}catch(e){msg(e.message)}}
async function loadMe(){const j=await req("/me");player=j.player;localStorage.setItem("kdsPlayer",JSON.stringify(player));updateProfileUI()}
async function loadMatches(){try{const q=new URLSearchParams();if($("cat").value)q.set("gameCategory",$("cat").value);if($("mode").value)q.set("gameMode",$("mode").value);const j=await req("/tournaments?"+q);$("matches").innerHTML=j.tournaments.length?j.tournaments.map(t=>`<div class="match">${t.bannerUrl?`<img src="${esc(t.bannerUrl)}">`:""}<h3>${esc(t.title)}</h3><span class="pill">${esc(t.gameCategory)}</span><span class="pill">${esc(t.gameMode)}</span><p>Entry ₹${t.entryFee} · Slots ${t.players.length}/${t.maxPlayers||"∞"} · ${t.status}</p>${t.roomVisible?`<p><b>Room:</b> ${esc(t.roomId)} · <b>Pass:</b> ${esc(t.roomPass)}</p>`:""}<div class="grid"><select id="pay_${t.id}"><option>WALLET</option><option>VIP</option><option>FREE</option></select><button onclick="book('${t.id}')">Join Match</button>${t.streamUrl?`<button onclick="spectate('${t.id}')">Watch Live</button>`:""}</div></div>`).join(""):"<p class=muted>No matches found.</p>";$("proofTournament").innerHTML=j.tournaments.filter(t=>t.playerJoined).map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join("")}catch(e){msg(e.message)}}
async function book(id){try{const j=await req("/book",{method:"POST",body:JSON.stringify({tournamentId:id,paymentMode:$("pay_"+id).value})});player=j.player;localStorage.setItem("kdsPlayer",JSON.stringify(player));updateProfileUI();msg("Slot booked.");loadMatches()}catch(e){msg(e.message)}}
async function deposit(){try{await req("/deposit",{method:"POST",body:JSON.stringify({amount:$("damt").value,utr:$("dutr").value})});msg("Deposit request submitted. Wallet credit will happen only after admin approval.");}catch(e){msg(e.message)}}
async function withdraw(){try{const j=await req("/withdraw",{method:"POST",body:JSON.stringify({amount:$("wamt").value,upiId:$("wupi").value})});player=j.player;localStorage.setItem("kdsPlayer",JSON.stringify(player));updateProfileUI();msg("Withdrawal request submitted.")}catch(e){msg(e.message)}}
async function loadPayment(){const j=await req("/payment-details");$("payment").innerHTML=`<b>UPI:</b> ${esc(j.upiId||"Not set")} ${j.qrUrl?`<br><img src="${esc(j.qrUrl)}" style="max-width:180px;margin-top:8px;border-radius:12px">`:""}`}
async function evaluateLoyalty(){try{const j=await req("/loyalty/evaluate",{method:"POST"});$("loyalty").innerHTML=`Free matches: ${j.weekly.freeMatches} / required · Rank #1 wins: ${j.weekly.wins} / required · VIP: ${j.vipPasses}`;msg(j.granted?"VIP Free Pass added!":"No new pass generated.")}catch(e){msg(e.message)}}
async function loadNotifications(){const j=await req("/notifications");$("notifications").innerHTML=j.notifications.map(n=>`<div class="match"><b>${esc(n.title)}</b><br>${esc(n.message)}<br><small class=muted>${new Date(n.createdAt).toLocaleString()}</small></div>`).join("")||"<span class=muted>No notifications.</span>"}
async function readNotifications(){await req("/notifications/read",{method:"POST"});loadNotifications()}
async function submitProof(){try{await req("/proof",{method:"POST",body:JSON.stringify({tournamentId:$("proofTournament").value,screenshotUrl:$("proofUrl").value,killsClaimed:$("proofKills").value})});msg("Proof submitted for admin review.")}catch(e){msg(e.message)}}
async function spectate(id){try{const j=await req("/spectate",{method:"POST",body:JSON.stringify({tournamentId:id})});msg(j.message+" — stream 3 seconds me open hoga.");setTimeout(()=>window.open(j.streamUrl,"_blank"),3000)}catch(e){msg(e.message)}}
async function refresh(){await loadMe();updateProfileUI();await Promise.all([loadMatches(),loadPayment(),loadNotifications(),evaluateLoyalty().catch(()=>{})]);}
async function logout(){try{if(token)await req("/logout",{method:"POST"})}catch{}token=null;player=null;localStorage.removeItem("kdsPlayerToken");localStorage.removeItem("kdsPlayer");show()}
function show(){$("auth").classList.toggle("hidden",!!token&&!!player);$("app").classList.toggle("hidden",!token||!player);$("status").textContent=player?player.name:"Guest";$("logoutBtn").style.display=player?"block":"none";if(player)refresh().catch(e=>{msg(e.message);logout()})}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
(function(){const tokenParam=new URLSearchParams(location.search).get("reset");if(tokenParam)msg("Reset token received. Use your reset flow to set a new password.");show()})();
</script></body></html>
